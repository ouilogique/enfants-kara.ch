{{/* Usage: {{< update-date >}} -> 10.03.2026 14:30 CET ; ou {{< update-date format="02.01.2006 15:04:05 MST" >}} */}}
{{- $format := .Get "format" | default "02.01.2006 15:04 MST" -}}
<span class="update-note"><time datetime="{{ now.Format "2006-01-02T15:04:05Z07:00" }}">{{ now.Format $format }}</time></span>
