{{ define "main" }}
  {{- $nextPage := index (partial "nav-pages-flat.html" (sort site.Home.Pages "File.Path")) 0 -}}
  {{ if $nextPage }}<a data-page-nav="next" href="{{ $nextPage.RelPermalink }}" hidden></a>{{ end }}
  <section class="page home">
    <header class="home-hero">
      <img
        class="home-hero-image"
        src="{{ .Params.bgImage | relURL }}"
        alt="Enfants marchant vers un horizon lumineux"
      >
      <div class="home-hero-overlay"></div>
      <div class="home-hero-content">
        <a class="home-hero-brand" href="{{ `` | relURL }}">
          <span class="brand-mark" aria-hidden="true">
            <img src="{{ `images/logo-association-enfants-kara.png` | relURL }}" alt="Logo de l’association Enfants-Kara">
          </span>
          <span class="brand-copy">
            <span class="brand-kicker">Association</span>
            <span class="brand-name">{{ site.Title | safeHTML }}</span>
          </span>
        </a>
        <h1>{{ .Title | safeHTML }}</h1>
        <div class="home-hero-text">{{ .Content }}</div>
      </div>
    </header>
    <footer class="site-footer home-footer">
      <a href="https://jeanmonod.net" target="_blank" rel="noopener noreferrer" aria-label="jeanmonod.net"><span class="footer-mark" aria-hidden="true">❧</span></a>
    </footer>
  </section>
{{ end }}
