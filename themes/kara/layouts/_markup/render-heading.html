{{- /*
  Rendu des titres.

  Les attributs Goldmark des titres sont conservés, notamment la classe
  .emoji-sphere qui permet d’afficher une sphère rouge en CSS.
*/ -}}
<h{{ .Level }}{{ with .Anchor }} id="{{ . }}"{{ end }}{{ with .Attributes }}{{ range $name, $value := . }}{{ if ne $name "id" }} {{ $name }}="{{ $value }}"{{ end }}{{ end }}{{ end }}>{{ .Text | safeHTML }}</h{{ .Level }}>
