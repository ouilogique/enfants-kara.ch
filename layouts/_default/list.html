{{ define "main" }}
  <section class="page">
    <header class="page-header">
      <h1>{{ .Title | safeHTML }}</h1>
      {{ with .Params.description }}<p class="dek">{{ . }}</p>{{ end }}
    </header>
    <div class="content">
      {{ .Content }}
    </div>
    {{ $pages := .Pages.ByWeight }}
    {{ if gt (len $pages) 0 }}
      <section class="listing">
        {{ range $pages }}
          <article class="card">
            <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
            {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
          </article>
        {{ end }}
      </section>
    {{ end }}
  </section>
{{ end }}
