{{ define "main" }}
  <section class="page">
    {{ partial "page-header.html" . }}
    <div class="content">
      {{ .Content }}
    </div>
    {{ $pages := .Pages.ByWeight }}
    {{ if gt (len $pages) 0 }}
      <div class="listing">
        {{ range $pages }}
          <article class="card">
            <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle | safeHTML }}</a></h2>
            {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
          </article>
        {{ end }}
      </div>
    {{ end }}
  </section>
{{ end }}
