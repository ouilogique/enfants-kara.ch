<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default `fr` }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    {{ with .Params.description }}<meta name="description" content="{{ . }}">{{ else }}{{ with site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}{{ end }}
    <link rel="icon" type="image/svg+xml" href="{{ `favicon.svg` | relURL }}">
    <link rel="stylesheet" href="{{ `style.css` | relURL }}">
  </head>
  <body>
    {{ $rootPages := site.Home.Pages.ByWeight }}
    <div class="app shell">
      <aside class="sidebar" aria-label="Navigation du site">
        <a class="brand" href="{{ `` | relURL }}">{{ site.Title }}</a>
        <nav class="tree">
          {{ partial "nav-tree.html" (dict "nodes" $rootPages "current" .) }}
        </nav>
      </aside>
      <main class="mainpane">
        {{ block "main" . }}{{ end }}
      </main>
    </div>
  </body>
</html>
