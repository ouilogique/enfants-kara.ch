<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default `fr` }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    {{ with .Params.description }}<meta name="description" content="{{ . }}">{{ else }}{{ with site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}{{ end }}
    <link rel="stylesheet" href="{{ `style.css` | relURL }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell">
        <a class="brand" href="{{ `` | relURL }}">{{ site.Title }}</a>
        <nav class="topnav" aria-label="Navigation principale">
          {{ range where site.Sections "RelPermalink" "!=" "/" }}
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ end }}
        </nav>
      </div>
    </header>
    <main class="shell">
      {{ block "main" . }}{{ end }}
    </main>
  </body>
</html>
