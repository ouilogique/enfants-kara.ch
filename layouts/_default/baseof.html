<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default `fr` }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title | plainify }} | {{ site.Title }}{{ end }}</title>
    {{ with .Params.description }}<meta name="description" content="{{ . }}">{{ else }}{{ with site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}{{ end }}
    <link rel="icon" type="image/svg+xml" href="{{ `favicon.svg` | relURL }}">
    <link rel="stylesheet" href="{{ `style.css` | relURL }}">
    <script src="{{ `scripts.js` | relURL }}" defer></script>
  </head>
  <body class="{{ if .IsHome }}is-home{{ else if .IsSection }}is-section{{ else }}is-page{{ end }}">
    {{ $rootPages := site.Home.Pages.ByWeight }}
    <div class="app shell">
      <div class="sidepane">
        <a class="brand" href="{{ `` | relURL }}">
          <span class="brand-kicker">Association</span>
          <span class="brand-name">{{ site.Title }}</span>
        </a>
        <aside class="sidebar" aria-label="Navigation du site">
        <nav class="tree">
          {{ partial "nav-tree.html" (dict "nodes" $rootPages "current" .) }}
        </nav>
        </aside>
      </div>
      <main class="mainpane">
        {{ block "main" . }}{{ end }}
        {{ if not .IsHome }}
          <footer class="site-footer">
            <a href="https://jeanmonod.net" target="_blank" rel="noopener noreferrer">❧</a>
          </footer>
        {{ end }}
      </main>
    </div>
    <div class="lightbox" id="site-lightbox" hidden>
      <button class="lightbox-nav lightbox-prev" type="button" aria-label="Image precedente">&#8249;</button>
      <button class="lightbox-nav lightbox-next" type="button" aria-label="Image suivante">&#8250;</button>
      <button class="lightbox-close" type="button" aria-label="Fermer l'image">&times;</button>
      <figure class="lightbox-figure">
        <div class="lightbox-media"></div>
        <figcaption class="lightbox-caption"></figcaption>
      </figure>
      <p class="lightbox-count" aria-live="polite"></p>
    </div>
  </body>
</html>
