{{- $dest := .Destination -}}
{{- if hasPrefix $dest "/" -}}
  {{- $dest = strings.TrimPrefix "/" $dest | relURL -}}
{{- end -}}
<a href="{{ $dest }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- if strings.HasPrefix $dest "http" }} target="_blank" rel="noopener noreferrer"{{ end -}}
>{{ .Text }}</a>
