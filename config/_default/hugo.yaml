theme: kara
timeZone: "Europe/Zurich"
locale: "fr-CH"
title: "Enfants-Kara"
defaultContentLanguage: "fr"
enableRobotsTXT: true
publishDir: .hugo_nokdrive/public
resourceDir: .hugo_nokdrive/resources
ignoreFiles:
  # Les motifs sont comparés à des chemins absolus, avec le séparateur du système
  # (antislash sous Windows). On accepte donc les deux séparateurs et on n'ancre
  # pas au début de la ligne.
  - '(^|[\\/])content[\\/]templater[\\/].*$'
  - '(^|[\\/])content[\\/]modele[\\/].*$'
  - '(^|[\\/])content[\\/]templates[\\/].*$'  # au cas où
  - '(^|[\\/])content[\\/]\.obsidian[\\/].*$'
disableKinds:
  - taxonomy
  - term
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
params:
  fingerprintCSS: false
  author: Nicolas Jeanmonod
  description: "Association Enfants-Kara — Soutien aux enfants et jeunes au Togo depuis 2001."
  favicon: favicon.svg
  faviconType: image/svg+xml
  openGraphLocale: fr_CH
  productionBaseURL: https://enfants-kara.ch
  allPagesAreArticles: true
  socialImageAlt: Enfants souriants rassemblés à une fenêtre
  socialImageAltFromPageTitle: true
  socialImageFromSection: true
